services:
  # service configuration for our database
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ../data:/data
      - ../letsencrypt:/etc/letsencrypt

  database:
    
    # use the preferred version of the official Postgres image
    # see https://hub.docker.com/_/postgres/
    image: postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    container_name: database
    restart: unless-stopped
    # persist the database between containers by storing it in a volume
    volumes:
      # Volume novo para PostgreSQL 17: o db_data de 9.6 queda sen tocar
      # (volta atrás); os datos pásanse con pg_dump/pg_restore
      - db_data_17:/var/lib/postgresql/data

  # service configuration for our dockerized Rails app
  app:

    # use the Dockerfile next to this file
    build: .
    container_name: app
    restart: unless-stopped

    # rely on the RAILS_ENV value of the host machine
    # environment:
    #RAILS_ENV: $RAILS_ENV

    # makes the app container aware of the DB container
    depends_on:
      - database
      - memcached

    # expose the port we configured Unicorn to bind to
    ports:
      - "3000:3000"
    volumes: &app_volumes
      - ./config/secrets.yml:/var/www/consul/config/secrets.yml
      - storage:/var/www/consul/storage
    environment: &app_environment
      - RAILS_ENV=production
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=enabled
      - MEMCACHE_SERVERS=memcached:11211

  jobs:
    build: .
    restart: unless-stopped
    depends_on:
      - database
      - app
    volumes: *app_volumes
    environment: *app_environment
    command: bundle exec rake jobs:work

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped

volumes:
  db_data_17: {}
  storage: {}
