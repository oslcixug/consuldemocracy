        support: Tan só tes que facer clic no botón que verás a continuación «Apoiar esta proposta» e directamente poderás consultar os detalles antes de impulsala. Só as propostas que consigan o máximo apoio poderán levarse a cabo por parte da universidade, e pensei que ti seguro que me axudas a conseguilo!
