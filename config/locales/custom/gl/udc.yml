    machine_learning:
      help:
        description_2: Este módulo permite implantar calquera tipo de programas de IA/Machine Learning en CONSUL DEMOCRACY. Os programas poden procesar a información dispoñible en CONSUL DEMOCRACY e producir resultados que axuden tanto aos usuarios como aos administradores a levar a cabo unha participación máis eficaz e intelixente. O módulo foi desenvolvido para facilitar a implantación e execución de novos programas, mantendo independentes entre si o código xeral de CONSUL DEMOCRACY e o código destes novos programas.
