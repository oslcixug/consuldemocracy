        page:
          description: Emprega esta páxina para resolveres os problemas máis frecuentes.
        title: Tes algunha dúbida?
      how_to_use:
        text: 'Emprégao na túa entidade ou axúdanos a melloralo, é software libre.


          Este portal de goberno aberto emprega a [aplicación CONSUL DEMOCRACY] (https://github.com/consuldemocracy/consuldemocracy ''consul democracy github'') que é software libre con [licenza AGPLv3](http://www.gnu.org/licenses/agpl-3.0.html ''AGPLv3 gnu'' ), o que significa que calquera pode usar libremente o código, copialo, velo en detalle, modificalo e redistribuílo ao mundo coas modificacións que quixer (mantendo o que outros poidan facer á súa vez o mesmo). Porque xulgamos que a cultura é mellor e máis rica cando se libera.


          Se sabes programar, podes ver o código e axudáresnos a melloralo en [CONSUL DEMOCRACY app](https://github.com/consuldemocracy/consuldemocracy ''consul democracy github'').'
