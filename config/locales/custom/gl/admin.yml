# Cadeas en galego que faltan ou se corrixen respecto a Crowdin (2.6.1).
# Teñen prioridade sobre config/locales/gl/; cando cheguen a Crowdin/upstream, quitalas de aquí.
gl:
  admin:
    actions:
      select: Seleccionar
      show_to_valuators: Amosar %{name} ás persoas avaliadoras
    activity:
      show:
        filters:
          on_budget_investments: Proxectos de gasto
    budget_investments:
      index:
        basic_filters:
          title_or_id: Título ou ID
          valuator_or_group: Persoa avaliadora ou grupo
    cookies:
      vendors:
        create:
          notice: Provedor de cookies creado correctamente
        create_button: Crear provedor de cookies
        destroy:
          notice: Provedor de cookies eliminado correctamente
        edit:
          title: Editar provedor de cookies
        empty: Non se atopou ningún provedor
        form:
          cookie:
            help_text: Esta información usarase internamente. O nome da cookie debe ser único e só pode conter letras, díxitos e guións baixos.
          description:
            help_text: Esta información será visible publicamente.
          name:
            help_text: Esta información será visible publicamente.
          script:
            help_text: Este é o script que se executa cando a persoa usuaria acepta esta cookie. Podes introducir código JavaScript simple e facer referencia a outro JavaScript da aplicación.
        new:
          title: Novo provedor de cookies
        third_party_cookies: Cookies de terceiros
        update:
          notice: Provedor de cookies actualizado correctamente
    polls:
      votation_type:
        open_description: Pregunta aberta que permite á persoa usuaria dar unha única resposta coas súas propias palabras.
    proposals:
      index:
        list:
          author: Autoría
          id: ID
          summary: Resumo
          title: Proposta
    questions:
      show:
        answers:
          allow_custom_text:
            help: Permite que as persoas usuarias escriban a súa propia resposta ao escoller esta opción. Útil para opcións como «Outra (especificar)».
    settings:
      index:
        blank_option: Ningún
        cookies_consent:
          title: Consentimento de cookies
        cookies_consent_banner:
          title: Aviso de consentimento de cookies
        llm:
          title: Configuración do LLM
    site_customization:
      images:
        index:
          dimensions: (%{width}x%{height})
