# Cadeas en galego que faltan ou se corrixen respecto a Crowdin (2.6.1).
# Teñen prioridade sobre config/locales/gl/; cando cheguen a Crowdin/upstream, quitalas de aquí.
gl:
  sdg:
    goals:
      goal_5:
        long_description: '<p>A igualdade de xénero non só é un dereito humano fundamental, senón que é un dos fundamentos esenciais para construír un mundo pacífico, próspero e sostible.</p> <p>Conseguíronse algúns <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/gender-equality-womens-rights-in-review-key-facts-and-figures-en.pdf?a=en&amp;vs=935">avances</a> durante as últimas décadas: máis nenas están escolarizadas, e obrígase a menos nenas ao matrimonio precoz; hai máis mulleres con cargos en parlamentos e en posicións de liderado, e as leis estanse reformando para fomentar a igualdade de xénero.</p> <p>A pesar destes logros, aínda existen moitas <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/gender-equality-womens-rights-in-review-key-facts-and-figures-en.pdf?a=en&amp;vs=935">dificultades</a>: as leis e as normas sociais discriminatorias continúan sendo xeneralizadas, as mulleres seguen estando infrarrepresentadas a tódolos niveis de liderado político, e 1 de cada 5&nbsp;mulleres e nenas de entre 15 e 49&nbsp;anos afirma ter sufrido violencia sexual ou física a mans dunha parella íntima nun período de 12&nbsp;meses.</p> <p>Os efectos da <a href="https://www.un.org/sites/un2.un.org/files/policy_brief_on_covid_impact_on_women_9_apr_2020_updated.pdf">pandemia da COVID-19 poderían reverter os escasos logros</a> que se acadaron en materia de igualdade de xénero e dereitos das mulleres.&nbsp; O brote de coronavirus <a href="https://www.unfpa.org/sites/default/files/resource-pdf/COVID-19_A_Gender_Lens_Guidance_Note.pdf">agrava as desigualdades existentes</a> para as mulleres e nenas a nivel mundial; desde a saúde e a economía, ata a seguridade e a protección social.</p> <p>As mulleres desempeñan un papel desproporcionado na resposta ao virus, incluso como traballadoras sanitarias en primeira liña e como coidadoras no fogar. O traballo de coidados non remunerado das mulleres aumentou de xeito significativo como consecuencia do peche das escolas e o aumento das necesidades dos anciáns. As mulleres tamén se ven máis afectadas polos efectos económicos da COVID-19, xa que traballan, de maneira desproporcionada, en mercados laborais inseguros. Preto do 60&nbsp;% das mulleres traballa na economía informal, o que as expón aínda máis a caer na pobreza.</p> <p>A pandemia tamén conduciu a un forte aumento da <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/issue-brief-covid-19-and-ending-violence-against-women-and-girls-en.pdf?a=en&amp;vs=5006">violencia contra as mulleres e as nenas</a>. Coas medidas de confinamento en vigor, moitas mulleres atópanse atrapadas na casa cos seus abusadores, con dificultades para acceder a servizos que están padecendo recortes e restricións. Os novos datos amosan que, desde o brote da pandemia, a violencia contra as mulleres e as nenas (e, especialmente, a violencia doméstica) intensificouse.</p>'
