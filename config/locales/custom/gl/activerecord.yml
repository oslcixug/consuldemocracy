# Cadeas en galego que faltan ou se corrixen respecto a Crowdin (2.6.1).
# Teñen prioridade sobre config/locales/gl/; cando cheguen a Crowdin/upstream, quitalas de aquí.
gl:
  activerecord:
    attributes:
      comment:
        parent_id: Comentario pai
      cookies/vendor:
        cookie: Nome da cookie
        name: Nome do provedor
        script: Código JavaScript
      poll/question/option:
        allow_custom_text: Permitir texto libre
      votation_type/vote_type:
        open: Resposta aberta
    errors:
      models:
        geozone:
          attributes:
            geojson:
              invalid_coordinates: O GeoJSON proporcionado contén coordenadas non válidas; as coordenadas deben estar no formato «Lonxitude, Latitude» e seguir o formato estándar RFC 7946
        votation_type:
          attributes:
            vote_type:
              cannot_change_to_open_ended: non se pode cambiar ao tipo de resposta aberta porque xa definiches posibles respostas válidas para esta pregunta
    models:
      administrator:
        one: Administrador
      comment:
        one: Comentario
      cookies/vendor:
        one: provedor de cookies
        other: provedores de cookies
      debate:
        one: Debate
      image:
        one: Imaxe
        other: Imaxes
      legislation/answer:
        one: Resposta
        other: Respostas
      legislation/draft_version:
        one: Versión do borrador
        other: Versións do borrador
      legislation/proposal:
        one: Proposta
      legislation/question:
        one: Pregunta
        other: Preguntas
      legislation/question_option:
        one: Opción de resposta pechada
        other: Opcións de resposta pechada
      newsletter:
        other: Boletíns informativos
      site_customization/content_block:
        other: Bloques
      site_customization/image:
        other: Imaxes
      site_customization/page:
        other: Páxinas
      tag:
        one: Etiqueta
  attributes:
    created_at: Data de creación
