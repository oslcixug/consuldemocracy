# Cadeas en galego que faltan ou se corrixen respecto a Crowdin (2.6.1).
# Teñen prioridade sobre config/locales/gl/; cando cheguen a Crowdin/upstream, quitalas de aquí.
gl:
  settings:
    cookies_consent:
      more_info_link: Ligazón á política de cookies
      more_info_link_description: Ligazón á páxina da política de cookies que se amosa no aviso de consentimento.
      version_name: Nome da versión
      version_name_description: Cambia o nome da versión para que todas as persoas usuarias teñan que dar de novo o consentimento das cookies. Pode ser útil cando se introducen cambios importantes na política de cookies que requiren un novo consentimento.
    feature:
      cookies_consent: Aviso de consentimento de cookies
      cookies_consent_description: Activa o aviso de consentimento de cookies para informar as persoas usuarias sobre as cookies que usa a aplicación.
      facebook_login: Inicio de sesión con Facebook
      facebook_login_description: Permitir que as persoas usuarias inicien sesión coa conta de Facebook
      gdpr:
        require_consent_for_embedded_videos: Consentimento para vídeos incrustados
        require_consent_for_embedded_videos_description: Amosar un aviso e pedir confirmación á persoa usuaria antes de cargar vídeos incrustados de provedores externos.
        require_consent_for_notifications: Consentimento explícito para as notificacións
        require_consent_for_notifications_description: Pedir o consentimento explícito das persoas usuarias para enviarlles boletíns e información semellante, como esixe o Regulamento Xeral de Protección de Datos (RXPD).
        warning_for_external_links: Aviso nas ligazóns externas
        warning_for_external_links_description: Activa unha xanela emerxente que pide confirmación antes de ir a un sitio web externo.
      google_login: Inicio de sesión con Google
      google_login_description: Permitir que as persoas usuarias inicien sesión coa conta de Google
      oidc_login: Inicio de sesión con OpenID Connect
      oidc_login_description: Permitir que as persoas usuarias inicien sesión con OpenID Connect (OIDC)
      saml_login: Inicio de sesión con SAML
      saml_login_description: Permitir que as persoas usuarias inicien sesión con SAML
      twitter_login: Inicio de sesión con Twitter
      twitter_login_description: Permitir que as persoas usuarias inicien sesión coa conta de Twitter
      wordpress_login: Inicio de sesión con WordPress
      wordpress_login_description: Permitir que as persoas usuarias inicien sesión coa conta de WordPress
    llm:
      model: Modelo
      model_description: O modelo de LLM que se vai usar.
      provider: Provedor de LLM
      provider_description: Os provedores estarán desactivados ata que se configuren as credenciais en secrets.yml.
      title: Configuración do LLM
      use_ai_image_suggestions: Suxestións de imaxes con IA
      use_ai_image_suggestions_description: Permitir que as persoas usuarias usen IA para suxerir imaxes de Pexels, en vez de subir as súas propias.
      use_llm_for_translations: Tradución de contidos
      use_llm_for_translations_description: Usar un LLM para traducir os contidos, con prioridade sobre os servizos de tradución de Microsoft.
